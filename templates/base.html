<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{% endblock %} · Astro Imaging Planner</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='retro.css') }}?v={{ VERSION }}">
</head>
<body>
<script>try{if(localStorage.getItem("aip-red")==="1")document.body.classList.add("red")}catch(e){}</script>
<div class="win dlg" style="margin:6vh auto 0">
  <div class="titlebar">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="9" width="7" height="4" fill="#c0c0c0" transform="rotate(-30 4 11)"/><rect x="6" y="13" width="2" height="3" fill="#808080"/><circle cx="13" cy="3" r="1" fill="#ffff00"/><circle cx="10" cy="1.5" r=".7" fill="#fff"/></svg>
    <span class="tt">{{ self.title() }}</span>
  </div>
  <form method="post" class="dbody" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {% block form %}{% endblock %}
  </form>
</div>
</body>
</html>
